name: Publish Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.7.5)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found. Build will use debug signature fallback."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs with Gradle
        env:
          STORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release.keystore' || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug -x lintVitalRelease --stacktrace

      - name: Prepare Release Assets
        id: assets
        run: |
          TAG="${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || inputs.tag_name || 'v1.7.5' }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p release_assets

          cp app/build/outputs/apk/release/app-release.apk "release_assets/MaterialFiles-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/MaterialFiles-${TAG}-debug.apk"

          cd release_assets
          sha256sum MaterialFiles-*.apk > sha256sums.txt
          cat sha256sums.txt
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/MaterialFiles-*.apk
            release_assets/sha256sums.txt
          tag_name: ${{ steps.assets.outputs.tag }}
          name: ${{ steps.assets.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
